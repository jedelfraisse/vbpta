name: Dev CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "stage", "live" ]

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore centralportal.slnx

      - name: Build
        run: dotnet build centralportal.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test centralportal.slnx --configuration Release --no-build

      - name: Publish validation
        run: dotnet publish WebApp/WebApp.csproj --configuration Release --output ./publish --no-build
