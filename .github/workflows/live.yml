name: Deploy Live

on:
  push:
    branches: [ "live" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Detect migration changes
        id: migration_changes
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="$(git rev-parse HEAD^)"
          fi

          if git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" | grep -q '^SiteEngine/Migrations/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore vbpta-web.slnx

      - name: Build
        run: dotnet build vbpta-web.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test vbpta-web.slnx --configuration Release --no-build

      - name: Publish
        run: dotnet publish WebApp/WebApp.csproj --configuration Release --output ./publish --no-build

      - name: Add migration trigger marker
        if: steps.migration_changes.outputs.changed == 'true'
        run: echo "run migrations" > ./publish/wwwroot/run-migration.txt

      - name: Upload app-offline.htm
        run: |
          curl --silent --show-error --fail \
            --user "${{ secrets.FTP_LIVE_USER }}:${{ secrets.FTP_LIVE_PASS }}" \
            --upload-file ./Deployment/app-offline.htm \
            "ftp://${{ secrets.FTP_LIVE_HOST }}/app-offline.htm"

      - name: Deploy publish folder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_LIVE_HOST }}
          username: ${{ secrets.FTP_LIVE_USER }}
          password: ${{ secrets.FTP_LIVE_PASS }}
          local-dir: ./publish/
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/obj/**
            **/bin/**
            **/logs/**
            **/SiteEngine/Migrations/**

      - name: Delete app-offline.htm
        if: always()
        run: |
          curl --silent --show-error --user "${{ secrets.FTP_LIVE_USER }}:${{ secrets.FTP_LIVE_PASS }}" \
            --quote "DELE app-offline.htm" \
            "ftp://${{ secrets.FTP_LIVE_HOST }}/"

      - name: Health check
        if: always() && env.LIVE_HEALTHCHECK_URL != ''
        env:
          LIVE_HEALTHCHECK_URL: ${{ secrets.LIVE_HEALTHCHECK_URL }}
        run: curl --silent --show-error --fail "$LIVE_HEALTHCHECK_URL"

      - name: Deployment notification
        if: always() && env.LIVE_DEPLOY_WEBHOOK_URL != ''
        env:
          LIVE_DEPLOY_WEBHOOK_URL: ${{ secrets.LIVE_DEPLOY_WEBHOOK_URL }}
        run: |
          curl --silent --show-error --fail \
            -H "Content-Type: application/json" \
            -d "{\"environment\":\"live\",\"status\":\"completed\",\"sha\":\"${{ github.sha }}\"}" \
            "$LIVE_DEPLOY_WEBHOOK_URL"
