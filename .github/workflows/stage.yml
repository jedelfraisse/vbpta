name: Deploy Stage

on:
  push:
    branches: [ "stage" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore centralportal.slnx

      - name: Build
        run: dotnet build centralportal.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test centralportal.slnx --configuration Release --no-build

      - name: Publish
        run: dotnet publish WebApp/WebApp.csproj --configuration Release --output ./publish --no-build

      - name: Upload app_offline.htm
        run: |
          curl --silent --show-error --fail \
            --user "${{ secrets.FTP_STAGE_USER }}:${{ secrets.FTP_STAGE_PASS }}" \
            --upload-file ./Deployment/app_offline.htm \
            "ftp://${{ secrets.FTP_STAGE_HOST }}/app_offline.htm"

      # ANCM's file watcher unloads the app almost immediately, but give it a
      # moment before we start replacing locked DLLs below.
      - name: Wait for app to unload
        run: sleep 5

      - name: Deploy publish folder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_STAGE_HOST }}
          username: ${{ secrets.FTP_STAGE_USER }}
          password: ${{ secrets.FTP_STAGE_PASS }}
          local-dir: ./publish/
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/obj/**
            **/bin/**
            **/logs/**
            **/SiteEngine/Migrations/**
            appsettings.json

      - name: Delete app_offline.htm
        if: always()
        run: |
          curl --silent --show-error --user "${{ secrets.FTP_STAGE_USER }}:${{ secrets.FTP_STAGE_PASS }}" \
            --quote "DELE app_offline.htm" \
            "ftp://${{ secrets.FTP_STAGE_HOST }}/"

      - name: Health check
        if: always() && env.STAGE_HEALTHCHECK_URL != ''
        env:
          STAGE_HEALTHCHECK_URL: ${{ secrets.STAGE_HEALTHCHECK_URL }}
        run: curl --silent --show-error --fail "$STAGE_HEALTHCHECK_URL"
