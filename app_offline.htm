<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Application Offline</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 2rem;
      max-width: 560px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }
    h1 {
      margin-top: 0;
      font-size: 1.6rem;
    }
    p {
      margin-bottom: 0;
      line-height: 1.5;
      color: #4b5563;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Application Offline</h1>
    <p>The app is currently offline for maintenance and will be online later.</p>
  </main>
</body>
</html>
